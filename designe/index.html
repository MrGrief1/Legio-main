<!DOCTYPE html>
<html lang="ru" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <!-- The React/lucide importmap that used to sit here pointed at a third-party CDN and was dead
       weight: Vite bundles those packages into /assets, so nothing ever resolved through it. It
       was also the only reason the CSP had to allow an external script origin. Removed on both
       counts — dropping it removes a supply-chain dependency without changing what loads.
       The custom-elements guard moved to its own file so the CSP can forbid inline scripts. -->
  <script src="/custom-elements-guard.js"></script>
  <!-- Must stay a plain synchronous script in <head>: it decides light/dark before the first
       paint. With defer/module it would run after the page is already on screen and the fix
       would be visible as a flash. -->
  <script src="/theme-init.js"></script>
</head>

<!-- Фон повторяет фон приложения в обеих темах. С жёстким светлым bg-gray-100 тёмная тема
     успевала мигнуть белым в кадрах между применением класса и монтированием React. -->

<body class="bg-zinc-50 dark:bg-black">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
